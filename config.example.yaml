# Beian2API 配置示例
# 优先级：默认值 < 本文件 < 环境变量
# 只需复制为 config.yaml 再按需修改；不复制也能直接跑。

listen: ":8080"        # 监听地址，:8080 表示所有网卡
data_dir: "./data"     # 数据目录（缓存、历史、监控都在一个文件里）
log_level: "info"      # debug / info / warn / error
base_url: ""           # 对外访问地址，用于生成 OpenAPI 里的 server；留空自动推断

# 只有在反向代理后面才打开。打开后才采信 X-Forwarded-For / X-Real-IP，
# 否则限流的 key 就成了客户端自己填的头——每个请求换个头就换一桶令牌。
trust_proxy: false

cache:
  ttl: 21600           # 已备案结果缓存 6 小时
  negative: 600        # 未备案结果缓存 10 分钟
  stale_max: 604800    # 上游全挂时，最多回退 7 天内的旧快照

rate_limit:
  enabled: true        # 每 IP 令牌桶
  rps: 20
  burst: 60

auth:
  # 打开后所有 /api 接口（含 RSS 与徽章以外的管理接口）都需要 API Key。
  # enabled 与 keys 必须同时成立：只写 enabled 而没有 Key 会直接拒绝启动，
  # 因为那种状态没有任何可校验的凭据，接口其实是全裸的。
  enabled: false
  keys: []
  # 打开鉴权的示例：
  #   enabled: true
  #   keys:
  #     - "bk_换成你自己的key"   # 用 `beian2api keygen` 生成
  # 网页端在 401 时会自动露出输入框，填一次存在浏览器里。

cors:
  - "*"                # 生产环境建议改成你的前端域名

storage:
  # 只增数据（变更流水、历史快照）的滚动保留上限，0 表示不裁剪。
  # 不设上限的部署跑上一年，数据文件会一直长大，而首页只看最近 10 条。
  retain_changes: 2000      # 变更流水保留最近多少条（全局）
  retain_history: 200       # 每个域名保留多少条历史快照（按域名分别算）
  # 历史快照的全局上限（跨所有域名）。只有按域名的配额挡不住「刷一批随机域名各查一次」，
  # 每个域名都没超限，合起来却能无限长。不能小于 retain_history。
  retain_history_total: 20000

providers:
  # weight 越大越优先，0 表示禁用
  - name: miit          # 工信部官方接口，数据最权威，但机房 IP 常被 WAF 拦
    enabled: true
    weight: 100
    timeout: 8
  - name: apihz         # 第三方公开接口，作为后备
    enabled: true
    weight: 40
    timeout: 8
    # 不填则用公共测试凭据。公共凭据被限流时不会报错，只表现为「偶尔查不到」，
    # 生产环境建议填自己的（免费注册）：
    # id: "你的 id"
    # key: "你的 key"

watch:
  enabled: true
  interval: 86400      # 每 24 小时巡检一次
  workers: 4
  fail_threshold: 3    # 连续几轮回源失败才推送一次告警（1 会被偶发抖动刷屏）
  webhook: ""          # 旧字段，等价于一个 generic 通道；多渠道请用下面的 notify

notify:
  retries: 3           # 单条消息最多投递几次（含首次），只对网络错误与限流生效
  channels:
    # kind 留空会按 URL 自动识别；也可以显式写 dingtalk / wecom / feishu / slack / generic
    - name: 运维群
      kind: dingtalk
      url: "https://oapi.dingtalk.com/robot/send?access_token=xxx"
      # 机器人开了「加签」时填这里，会自动补 timestamp 与 sign
      secret: ""
      # 只推指定事件；省略即全推。可选：
      #   changed        备案信息变化
      #   revoked        备案被注销
      #   registered     新备案
      #   upstream_error 连续多轮查不到（比变更更急：你不知道它现在死没死）
      #   recovered      从故障中恢复
      events: [changed, revoked, registered, upstream_error, recovered]

    # - name: 企业微信
    #   url: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxx"

    # - name: 飞书
    #   url: "https://open.feishu.cn/open-apis/bot/v2/hook/xxx"
    #   secret: ""        # 飞书签名校验密钥

    # - name: 自建网关
    #   kind: generic
    #   url: "https://your-gateway/hook"
