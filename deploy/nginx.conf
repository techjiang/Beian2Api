# Nginx 反代示例：证书路径按需修改
server {
    listen 443 ssl http2;
    server_name beian.example.com;

    ssl_certificate     /etc/ssl/beian/fullchain.pem;
    ssl_certificate_key /etc/ssl/beian/privkey.pem;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    # 跑在 Cloudflare 后面时，先让 nginx 用 CF 的头还原真实客户端 IP：
    #   set_real_ip_from 173.245.48.0/20;   # 以及 CF 的其它网段
    #   real_ip_header CF-Connecting-IP;
    # 这样 $remote_addr 才是真实客户端，下面 $proxy_add_x_forwarded_for 追加的
    # 末段也才是它——服务端只认 X-Forwarded-For 的末段（第一段是客户端自己填的）。

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

server {
    listen 80;
    server_name beian.example.com;
    return 301 https://$host$request_uri;
}
